name: Omni CI

# Hardened Blue Wall baseline:
# 1. preflight checks out ONLY base branch (main) into .trusted-ci and runs trusted gate scripts.
# 2. Diff-lock-main blocks sensitive path edits (.github/**, pyproject*.toml, docker/**, conftest.py, etc.)
#    unless a maintainer explicitly approves the exact head SHA (/approve-ci-sha <sha>).
# 3. preflight emits exact_sha and base_ref; downstream setup/pr-test pin PR checkout to exact_sha
#    and invoke composite actions strictly from .trusted-ci (base branch), never PR checkout.
# 4. All external GitHub Actions are pinned to 40-char commit SHAs with persist-credentials: false.

on:
  pull_request:
    types: [opened, labeled, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      ci_labels:
        description: "Space-separated CI labels, resolved like PR labels."
        required: true
        type: string

concurrency:
  group: omni-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  preflight:
    name: omni-ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_self_hosted: ${{ steps.plan.outputs.run_self_hosted }}
      run_unit_test: ${{ steps.plan.outputs.run_unit_test }}
      exact_sha: ${{ steps.pr.outputs.exact_sha }}
      base_ref: ${{ steps.pr.outputs.base_ref }}
    steps:
      - name: Fetch CI labels and exact SHA
        id: pr
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          DISPATCH_CI_LABELS: ${{ github.event.inputs.ci_labels }}
        with:
          github-token: ${{ github.token }}
          script: |
            if (context.eventName === "workflow_dispatch") {
              const labels = (process.env.DISPATCH_CI_LABELS || "").split(/\s+/).filter(Boolean);
              core.setOutput("labels", JSON.stringify(labels));
              core.setOutput("draft", "false");
              core.setOutput("exact_sha", context.sha);
              core.setOutput("base_ref", "main");
            } else {
              const pr = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
              });
              core.setOutput("labels", JSON.stringify(pr.data.labels.map((label) => label.name)));
              core.setOutput("draft", pr.data.draft ? "true" : "false");
              core.setOutput("exact_sha", pr.data.head.sha);
              core.setOutput("base_ref", pr.data.base.ref);
            }

      - name: Block draft PR
        if: ${{ fromJson(steps.pr.outputs.draft) }}
        run: |
          echo "PR is draft. Blocking Omni CI."
          exit 1

      - name: Checkout trusted base CI scripts ONLY
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.pr.outputs.base_ref }}
          path: .trusted-ci
          persist-credentials: false

      - name: Diff-lock-main sensitive path check (fail closed)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .trusted-ci/.github/scripts/check_pr_trusted_paths.py

      - name: Resolve CI stages from trusted main script
        id: plan
        env:
          LABELS_JSON: ${{ steps.pr.outputs.labels }}
        run: |
          python .trusted-ci/.github/scripts/resolve_ci_labels.py resolve \
            --labels-json "${LABELS_JSON}" \
            --seed "${GITHUB_RUN_ID}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Check PR lint and mergeability from trusted main script
        if: ${{ github.event_name == 'pull_request' && steps.plan.outputs.run_self_hosted == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .trusted-ci/.github/scripts/pr_ci_gate.py --timeout-seconds 180 --poll-seconds 5

  setup:
    name: setup - omni venv
    needs: preflight
    if: needs.preflight.result == 'success' && needs.preflight.outputs.run_self_hosted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMNI_SIMULATED_H100: "1"
    steps:
      - name: Checkout PR exact SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.exact_sha }}
          persist-credentials: false

      - name: Verify exact_sha and strip .git
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          expected="${{ needs.preflight.outputs.exact_sha }}"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "TOCTOU SHA mismatch: actual=${actual} expected=${expected}" >&2
            exit 1
          fi
          echo "Verified exact_sha=${actual}"

      - name: Checkout trusted base composite actions ONLY
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.base_ref }}
          path: .trusted-ci
          persist-credentials: false

      - name: Simulated H100 runner checkpoint
        shell: bash
        run: |
          echo "SIMULATED_H100_HARDENED_EXECUTED job=setup pr=${{ github.event.pull_request.number }} exact_sha=${{ needs.preflight.outputs.exact_sha }}"

      - uses: ./.trusted-ci/.github/actions/omni-setup
        with:
          venv-name: omni
          install-deps: "true"

  pr-test:
    name: PR Test
    needs: [preflight, setup]
    if: needs.setup.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMNI_SIMULATED_H100: "1"
    steps:
      - name: Checkout PR exact SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.exact_sha }}
          persist-credentials: false

      - name: Checkout trusted base composite actions ONLY
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.base_ref }}
          path: .trusted-ci
          persist-credentials: false

      - uses: ./.trusted-ci/.github/actions/omni-setup
        with:
          venv-name: omni

      - name: Simulate H100 PR test
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "SIMULATED_H100_PR_TEST_HARDENED_EXECUTED exact_sha=${actual}"
