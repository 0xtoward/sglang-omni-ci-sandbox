name: Strip CI Labels On Push

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  strip_run_labels:
    name: Strip stale run-* labels on force-push / synchronize
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove run-* CI labels
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ github.token }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const runLabels = labels.map((l) => l.name).filter((n) => n.startsWith("run-"));
            if (runLabels.length === 0) {
              core.info(`PR #${prNumber} has no run-* labels to strip.`);
              return;
            }
            for (const label of runLabels) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  name: label,
                });
                core.info(`Removed stale label '${label}' from PR #${prNumber} after push.`);
              } catch (err) {
                core.warning(`Failed removing label '${label}': ${err.message}`);
              }
            }
